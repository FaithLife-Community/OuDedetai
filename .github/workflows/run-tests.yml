name: Run app tests on PR creation or modification
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: pip
    - name: Install Qt platform libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 \
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

    - name: install app
      run: |
        pip install  --upgrade pip
        pip install .
    - name: run-tests
      run: |
        python3 -m unittest discover -v