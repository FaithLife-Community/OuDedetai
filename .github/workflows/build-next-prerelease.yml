name: Build next test build (prerelease)

# Builds a branch (normally `next`) and creates a DRAFT PRERELEASE on this repo for a
# maintainer to check and publish. Prereleases are never marked Latest, so installs on
# the stable channel (which follow Latest) and on the dev channel (which follows
# test-builds) never see these builds. Testers opt in by downloading one.
#
# Before running: set LLI_CURRENT_VERSION in ou_dedetai/constants.py on the branch to
# the version you enter here (e.g. 4.0.0-beta.17.dev2), so the binary knows its own
# version and later test builds count as newer.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, without the v (e.g. 4.0.0-beta.17.dev2); must match LLI_CURRENT_VERSION on the branch"
        required: true
        type: string
      branch:
        description: "Branch to build"
        required: true
        default: next
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch }}
    - name: Check the version on the branch matches
      id: check
      run: |
        version=$(python3 -c 'import re; print(re.search(r"LLI_CURRENT_VERSION = \"([^\"]+)\"", open("ou_dedetai/constants.py").read())[1])')
        if [ "$version" != "${{ inputs.version }}" ]; then
          echo "::error::LLI_CURRENT_VERSION on ${{ inputs.branch }} is $version, not ${{ inputs.version }}"
          exit 1
        fi
        case "$version" in
          *.dev*) ;;
          *) echo "::error::A test build's version must be a .devN version (e.g. 4.0.0-beta.17.dev2)"; exit 1 ;;
        esac
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/build-branch.yml
    with:
      branch: ${{ inputs.branch }}

  release:
    # One job for both architectures, so they land in the same draft.
    runs-on: ubuntu-latest
    needs: [check, build]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4  # this workflow's own branch, for the release notes
    - uses: actions/download-artifact@v4
      with:
        name: oudedetai-x86_64
        path: dist
    - uses: actions/download-artifact@v4
      with:
        name: oudedetai-arm
        path: dist
    - run: chmod +x dist/oudedetai-*
    - name: Create draft prerelease
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ inputs.version }}
        target_commitish: ${{ needs.check.outputs.sha }}
        name: "next test build – not for general use (v${{ inputs.version }})"
        body_path: .github/next-test-build-notes.md
        draft: true
        prerelease: true
        files: |
          dist/oudedetai-x86_64
          dist/oudedetai-arm
