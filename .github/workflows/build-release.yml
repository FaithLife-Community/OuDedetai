name: Build & release

on:
  #schedule:
  #  - cron: '0 4,16 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: "The version string (e.g. 'v4.0.0-alpha.1'):"
        required: true
        type: string
      prerelease:
        description: "Check if pre-release"
        required: true
        type: boolean

jobs:
  build:
    uses: ./.github/workflows/build-branch.yml
    with:
      branch: main

  release:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm
    needs: build
    permissions:
      contents: write
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: oudedetai-${{ matrix.arch }}

    - name: Make binary executable
      run: chmod +x oudedetai-${{ matrix.arch }}

    - name: Upload release to GitHub
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ inputs.tag }}
        draft: true
        prerelease: ${{ inputs.prerelease }}
        files: oudedetai-${{ matrix.arch }}

  # Unsuffixed x86_64 copy ("oudedetai") for versions <= v4.0.0-beta.15,
  # whose self-update (network.py) takes the release's first asset.
  # Uploaded last so it's first whether assets sort by name or newest upload.
  release-unsuffixed:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: oudedetai-x86_64

    - name: Rename x86_64 binary to unsuffixed name
      run: |
        mv oudedetai-x86_64 oudedetai
        chmod +x oudedetai

    - name: Upload unsuffixed binary to GitHub
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ inputs.tag }}
        draft: true
        prerelease: ${{ inputs.prerelease }}
        files: oudedetai
